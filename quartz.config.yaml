# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Ghiaccio的手账
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: xh-diary.me
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title:
        name: Source Sans Pro
        weights:
          - 400
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fbf1c7"
        lightgray: "#f2e5bc"
        gray: "#7c6f64"
        darkgray: "#3c3836"
        dark: "#282828"
        secondary: "#8a1814"
        tertiary: "#076678"
        highlight: rgba(242, 207, 129, 0.28)
        textHighlight: "#f2cf8188"
      darkMode:
        light: "#282828"
        lightgray: "#1d2021"
        gray: "#504945"
        darkgray: "#ebdbb2"
        dark: "#fbf1c7"
        secondary: "#83a598"
        tertiary: "#fb4934"
        highlight: rgba(131, 165, 152, 0.18)
        textHighlight: "#d7992155"
plugins:
  # 本地修改版：补上「git 首次提交时间 → created」，这样新文章无需手写 created frontmatter
  - source: ./plugins/created-modified-date
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    options:
      # 关闭 smartypants：它会把中文省略号「……」(六个点)压成单个「…」(三个点)，
      # 还会把直引号改成弯引号等。对中文写作弊大于利，关掉以保留原样输入。
      enableSmartyPants: false
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  # 本地修改版：保留 contentIndex.json 里的 date 字段，供 Explorer 按创建时间排序
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      title: Contents
      sortFn: "(a, b) => { if (a.isFolder && b.isFolder) { var order = ['diary', '关于爱', '关于我', '关于世界', '关于本站']; var ai = order.indexOf((a.slugSegment || '').toLowerCase()); var bi = order.indexOf((b.slugSegment || '').toLowerCase()); if (ai === -1) ai = order.length; if (bi === -1) bi = order.length; if (ai !== bi) return ai - bi; return (a.displayName || '').localeCompare(b.displayName || '', undefined, { numeric: true, sensitivity: 'base' }); } if (a.isFolder !== b.isFolder) { return a.isFolder ? -1 : 1; } var ad = a.data && a.data.date ? new Date(a.data.date).getTime() : 0; var bd = b.data && b.data.date ? new Date(b.data.date).getTime() : 0; if (ad !== bd) return bd - ad; return (b.displayName || '').localeCompare(a.displayName || '', undefined, { numeric: true, sensitivity: 'base' }); }"
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: false
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      rootName: Contents
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # 本地组件：文章正文下方的「上一篇 / 下一篇」导航（同文件夹内按日期，下一篇=更早的一篇）
  - source: ./plugins/cusdis-comments
    enabled: true
    options:
      host: https://cusdis.com
      appId: 4b79d561-363b-4380-b769-bb931eb2a126
      lang: zh-cn
    layout:
      position: afterBody
      priority: 30
  - source: ./plugins/page-navigation
    enabled: true
    options:
      prevLabel: 上一篇
      nextLabel: 下一篇
    layout:
      position: afterBody
      priority: 20
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: ./plugins/recent-articles
    enabled: true
    options:
      title: 近期文章更新
      limit: 4
      excludeFolders:
        - diary
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: afterBody
      priority: 5
      condition: index
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      positions:
        right: []
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
