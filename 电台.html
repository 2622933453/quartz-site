h1 class="article-title">电台</h1></div></div><article class="popover-hint"><div class="markdown-preview-view markdown-rendered"><p>这里先放一个观众来信箱。</p>
<p>你可以写你现在的迷茫、人际关系方面的困扰、一个奇怪的想法、也可以是你自己的故事。</p>
<p>这些来信都会直接发给我，不会公开显示。</p>
<div class="radio-actions" aria-label="电台入口">
  <button id="radio-letter-toggle" class="radio-action radio-action-primary" type="button" aria-expanded="false" aria-controls="radio-letter-form">写来信</button>
</div>
<form id="radio-letter-form" class="radio-letter-form" hidden>
  <input type="checkbox" name="botcheck" style="display:none !important;" tabindex="-1" autocomplete="off" aria-hidden="true" class="checkbox-toggle"/>
  <label class="radio-field">
    <span>怎么称呼你</span>
    <input id="radio-name" class="radio-input" name="name" type="text" maxlength="80" autocomplete="name" placeholder="写一个称呼就好" required/>
  </label>
  <label class="radio-field">
    <span>来信内容</span>
    <textarea id="radio-content" class="radio-textarea" name="letter" placeholder="写下想寄来的话……" rows="8" maxlength="3000" required></textarea>
  </label>
  <div class="radio-submit-row">
    <button type="submit" class="radio-submit">寄出</button>
  </div>
  <p id="radio-result" class="radio-result" aria-live="polite"></p>
</form>
<style>
.radio-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
  margin: 1.6rem 0 2rem;
}
.radio-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.6rem;
  padding: 0 1.1rem;
  box-sizing: border-box;
  font: inherit;
  text-decoration: none;
  cursor: pointer;
  border-radius: 8px;
  border: 1px solid var(--lightgray);
}
.radio-action-primary {
  color: var(--light);
  background: var(--secondary);
  border-color: var(--secondary);
}
.radio-action-primary:hover {
  background: var(--tertiary);
  border-color: var(--tertiary);
}
.radio-letter-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  max-width: 40rem;
  margin: 1rem 0 2.5rem;
}
.radio-letter-form[hidden] {
  display: none !important;
}
.radio-field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  color: var(--darkgray);
  font-size: 0.95rem;
}
.radio-input,
.radio-textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 0.7rem 0.9rem;
  font-family: inherit;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--dark);
  background: var(--light);
  border: 1px solid var(--lightgray);
  border-radius: 8px;
  transition: border-color 0.15s ease;
}
.radio-input:focus,
.radio-textarea:focus {
  outline: none;
  border-color: var(--secondary);
}
.radio-textarea {
  resize: vertical;
}
.radio-submit-row {
  display: flex;
}
.radio-submit {
  padding: 0.6rem 1.4rem;
  font-family: inherit;
  font-size: 1rem;
  color: var(--light);
  background: var(--secondary);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease, opacity 0.15s ease;
}
.radio-submit:hover {
  background: var(--tertiary);
}
.radio-submit:disabled {
  opacity: 0.5;
  cursor: default;
}
.radio-result {
  margin: 0;
  min-height: 1.4em;
  color: var(--gray);
  font-size: 0.95rem;
}
.radio-result.ok {
  color: var(--secondary);
}
.radio-result.err {
  color: #c0392b;
}
</style>
<script>
(function () {
  const WEB3FORMS_KEY = "99adb30b-efa0-4935-8c5a-79e3faa094cd"

  function initRadioLetters() {
    const toggle = document.getElementById("radio-letter-toggle")
    const form = document.getElementById("radio-letter-form")
    if (!form) return

    if (toggle && !toggle.dataset.bound) {
      toggle.dataset.bound = "1"
      toggle.addEventListener("click", () => {
        const willOpen = form.hidden
        form.hidden = !willOpen
        toggle.setAttribute("aria-expanded", String(willOpen))
        toggle.textContent = willOpen ? "收起" : "写来信"
        if (willOpen) document.getElementById("radio-name").focus()
      })
    }

    if (form.dataset.bound) return
    form.dataset.bound = "1"

    const result = document.getElementById("radio-result")
    const submit = form.querySelector(".radio-submit")
    const content = document.getElementById("radio-content")
    const name = document.getElementById("radio-name")

    form.addEventListener("submit", async (event) => {
      event.preventDefault()
      if (form.botcheck && form.botcheck.checked) return

      const letter = content.value.trim()
      const senderName = name.value.trim()
      if (!senderName || !letter) return

      result.className = "radio-result"
      result.textContent = "正在寄出……"
      submit.disabled = true

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            access_key: WEB3FORMS_KEY,
            subject: "小浩日记 · 电台来信",
            from_name: "电台来信箱",
            称呼: senderName,
            使用方式: "直接转发到站长邮箱，不公开显示",
            来信: letter,
          }),
        })
        const data = await response.json()
        if (!response.ok || data.success === false) {
          throw new Error("submit failed")
        }

        form.reset()
        result.className = "radio-result ok"
        result.textContent = "收到啦，来信已经寄到我这里。"
      } catch (_) {
        result.className = "radio-result err"
        result.textContent = "寄出失败了，稍后再试试？"
      } finally {
        submit.disabled = false
      }
    })
  }

  initRadioLetters()
  document.addEventListener("nav", initRadioLetters)
})()
</script></div></article><hr/><div class="page-footer"><nav class="page-navigation" aria-label="文章导航"><span class="page-nav-link page-nav-empty"></span><a class="page-nav-link page-nav-next" href="./404"><span class="page-nav-label">下一篇</span><span class="page-nav-title">Not Found</span></a></nav></div></div><div class="right sidebar"></div><footer class><p>Created with <a href="https://quartz.jzhao.xyz/">Quartz v5.0.0</a> © 2026</p><ul><li><a href="https://github.com/jackyzha0/quartz">GitHub</a></li><li><a href="https://discord.gg/cRFFHYye7t">Discord Community</a></li></ul></footer></div></div></body><script src="./static/resource-after-e13fffa1.js" type="application/javascript" data-persist="true"></script><script src="./static/resource-after-8b336f9a.js" type="application/javascript" data-persist="true"></script><script src="./static/resource-after-baba652b.js" type="application/javascript" data-persist="true"></script><script src="./static/resource-after-5eb75950.js" type="module" data-persist="true"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/copy-tex.min.js" type="application/javascript" data-persist="true"></script><script src="./postscript-25bb6a32.js" type="module" data-persist="true"></script></html>
